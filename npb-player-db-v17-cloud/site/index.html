  const years={}; if(x.years && typeof x.years==='object'){for(const [yr,y] of Object.entries(x.years)){years[yr]={...y}; if(years[yr].team) years[yr].team=teamMap[years[yr].team]||years[yr].team;}}
  const career={}; const sum=(k)=>Object.values(years).reduce((a,y)=>a+(Number.isFinite(y[k])?y[k]:0),0);

  if(x.position==='hitter'){
    const ab=career.ab||0, h=career.h||0, pa=career.pa||0; career.ba=ab?h/ab:null; career.slg=ab?((career.tb||0)/ab):null; career.obp=pa?((h+(career.bb||0)+(career.hbp||0))/pa):null;

  } else {
    const ip=career.ip||0; career.era=ip?((career.er||0)*9/ip):null; career.whip=ip?((career.h||0)+(career.bb||0))/ip:null; career.kbb=(career.bb||0)?(career.k||0)/career.bb:null; career.k9=ip?9*(career.k||0)/ip:null;
    const fs=Object.values(years).filter(y=>Number.isFinite(y.fip)&&Number.isFinite(y.ip)); career.fip=fs.length?fs.reduce((a,y)=>a+y.fip*y.ip,0)/fs.reduce((a,y)=>a+y.ip,0):null;
  }
  const base=(typeof P!=='undefined')?P.find(p=>String(p.n).replace(/\s/g,'')===String(x.name||'').replace(/\s/g,'')):null;
  return {id:Number(x.id)||i+1,n:x.name||'不明',y:x.reading||base?.y||'',a:Array.from(new Set([...(base?.a||[]),...(x.aliases||[])])),d:Array.from(new Set([...(base?.d||[]),...(x.derogatory||[])])),pos:x.position==='pitcher'?'pitcher':'hitter',status:x.status||'ob',teams,career,years,source:x.source||''};
}
async function importDatabaseFile(file){
  const text=await file.text(); const db=JSON.parse(text); if(!Array.isArray(db.players)) throw new Error('players配列がありません');
  const imported=db.players.map(normalizeExternalPlayer); P.length=0; imported.forEach(x=>P.push(x));
  refreshAll(); document.getElementById('dbStatus').textContent=` ${P.length.toLocaleString()}選手を読み込みました（${db.updatedAt||'更新日時不明'}）`;
  localStorage.setItem('npbExternalDb',JSON.stringify(db));
}

const H=[['ba','打率'],['obp','出塁率'],['slg','長打率'],['ops','OPS'],['iso','ISO'],['woba','wOBA'],['h','安打'],['hr','本塁打'],['rbi','打点'],['runs','得点'],['sb','盗塁'],['g','試合'],['pa','打席']];
const R=[['era','防御率'],['fip','FIP'],['whip','WHIP'],['kbb','K/BB'],['k','奪三振'],['ip','投球回'],['wins','勝利'],['sv','セーブ'],['hld','ホールド'],['g','登板']];
const GR=['SS','S','A','B','C','D','E','F'];
const INV=new Set(['era','fip','whip']);
function metricList(pos){return pos==='hitter'?H:R} function allPlayers(){return P} function vals(list,m){return list.map(p=>p.career[m]).filter(Number.isFinite)}
function percentile(list,p,m,source='career'){const a=list.map(x=>x[source]?.[m]).filter(Number.isFinite);const v=p[source]?.[m];if(!a.length||!Number.isFinite(v))return null;const n= a.filter(x=>INV.has(m)?x>=v:x<=v).length;return 100*n/a.length}
function grade(s){return s==null?'-':s>=95?'SS':s>=90?'S':s>=80?'A':s>=70?'B':s>=60?'C':s>=50?'D':s>=40?'E':'F'}
function fmt(m,v){if(!Number.isFinite(v))return '-';if(['ba','obp','slg','ops','iso','woba'].includes(m))return v.toFixed(3);if(['era','fip','whip','kbb'].includes(m))return v.toFixed(2);return m==='ip'?v.toFixed(1):String(Math.round(v))}
function avatar(p){return `<div class="avatar">${p.n.replace(/\s/g,'').slice(0,2)}</div>`}
function fav(id){return localStorage.getItem('npb-fav-'+id)==='1'} function toggleFav(id){fav(id)?localStorage.removeItem('npb-fav-'+id):localStorage.setItem('npb-fav-'+id,'1');renderSearch();renderFav()}
function teamOptions(id,all=true){const e=document.getElementById(id);e.innerHTML=all?'<option value="all">全て</option>':'';for(const [k,v] of Object.entries(TEAM))e.insertAdjacentHTML('beforeend',`<option value="${k}">${v}</option>`)}
function playerOptions(id){const e=document.getElementById(id);e.innerHTML='';P.forEach(p=>e.insertAdjacentHTML('beforeend',`<option value="${p.id}">${p.n}（${p.status==='current'?'現役':'OB'}）</option>`))}
function searchPool(){const q=document.getElementById('q').value.trim().toLowerCase(),st=document.getElementById('status').value,t=document.getElementById('team').value,tp=document.getElementById('type').value,fo=document.getElementById('favOnly').value;return P.filter(p=>(p.n+p.y+p.a.join('')+p.d.join('')).toLowerCase().includes(q)).filter(p=>st==='all'||p.status===st).filter(p=>t==='all'||p.teams.includes(t)).filter(p=>tp==='all'||p.pos===tp).filter(p=>fo==='0'||fav(p.id))}
function renderSearch(){const a=searchPool(),e=document.getElementById('searchResults');e.innerHTML=a.map(p=>`<div class="card"><span class="fav" onclick="toggleFav(${p.id})">${fav(p.id)?'★':'☆'}</span><div class="playerHead">${avatar(p)}<div><div class="name">${p.n}</div><div class="muted">${p.pos==='hitter'?'野手':'投手'} / ${p.teams.map(x=>TEAM[x]||x).join('・')}</div><div class="small">${p.status==='current'?'現役':'OB'}</div></div></div><div class="notice ${p.status==='current'?'ok':''}" style="margin-top:10px">総合評価：<b>${overallGrade(p)}</b></div><div class="statline"><span>${p.pos==='hitter'?'OPS':'防御率'}</span><b>${fmt(p.pos==='hitter'?'ops':'era',p.career[p.pos==='hitter'?'ops':'era'])}</b></div><div class="statline"><span>キャリア評価</span><b>${overallScore(p).toFixed(1)} / 100</b></div><div class="toolbar" style="margin-top:9px"><button class="btn" onclick="detail(${p.id})">詳細・年度別</button><button class="btn" onclick="openSimilar(${p.id})">似た選手</button></div></div>`).join('')||'<div class="panel">該当する選手がいません。</div>'}
function weighted(p,source='career'){const ms=metricList(p.pos);const w=p.pos==='hitter'?{ops:20,ba:15,obp:15,slg:15,hr:10,rbi:8,h:7,g:5,pa:5}:{era:20,whip:15,fip:15,k:15,ip:12,wins:8,g:5,sv:5,hld:5};let total=0,ws=0;for(const [m,ww] of Object.entries(w)){const s=percentile(P.filter(x=>x.pos===p.pos),p,m,source);if(s!=null){total+=s*ww;ws+=ww}}return ws?total/ws:null}
function overallScore(p,source='career'){return weighted(p,source)??0} function overallGrade(p,source='career'){return grade(overallScore(p,source))}
function detail(id){const p=P.find(x=>x.id==id);const ms=metricList(p.pos);let html=`<div class="playerHead">${avatar(p)}<div><h2 style="margin:0">${p.n}</h2><div>${p.status==='current'?'現役':'OB'} / ${p.teams.map(x=>TEAM[x]||x).join('・')}</div><div class="badge grade-${overallGrade(p)}">キャリア ${overallGrade(p)} / ${overallScore(p).toFixed(1)}</div></div></div><h3>キャリア成績・項目別評価</h3><div class="metricGrid">`;for(const [m,l] of ms){const s=percentile(P.filter(x=>x.pos===p.pos),p,m);html+=`<div class="metricBox"><span>${l}</span><span class="badge grade-${grade(s)} g">${grade(s)}</span><div class="v">${fmt(m,p.career[m])}</div><div class="small">評価点 ${s==null?'-':s.toFixed(1)}</div></div>`}html+=`</div><h3>年度別評価</h3><div class="scroll"><table class="table"><tr><th>年度</th><th>総合</th>${ms.map(x=>`<th>${x[1]}</th>`).join('')}</tr>`;for(const [yr,y] of Object.entries(p.years).sort((a,b)=>+a[0]-+b[0])){let yp=yearPool(p.pos,yr);html+=`<tr><td>${yr}</td><td><span class="badge grade-${yearGrade(p,yr)}">${yearGrade(p,yr)}</span> ${yearScore(p,yr).toFixed(1)}</td>${ms.map(([m,l])=>{const s=yearPct(yp,p,m,yr);return `<td><span class="badge grade-${grade(s)}">${grade(s)}</span> ${fmt(m,y[m])}</td>`}).join('')}</tr>`}html+=`</table></div><h3>年度別推移</h3><canvas id="trend" width="1000" height="300"></canvas><div class="toolbar" style="margin-top:10px"><button class="btn" onclick="exportPlayerCSV(${p.id})">選手CSV</button><button class="btn" onclick="window.print()">印刷</button></div>`;showModal(html);drawTrend(p)}
function yearPool(pos,yr){return P.filter(p=>p.pos===pos&&p.years[yr])} function yearPct(pool,p,m,yr){const a=pool.map(x=>x.years[yr]?.[m]).filter(Number.isFinite),v=p.years[yr]?.[m];if(!a.length||!Number.isFinite(v))return null;return 100*a.filter(x=>INV.has(m)?x>=v:x<=v).length/a.length} function yearScore(p,yr){let y=p.years[yr],ms=metricList(p.pos),total=0,ws=0;for(const [m] of ms){if(Number.isFinite(y[m])){const s=yearPct(yearPool(p.pos,yr),p,m,yr);if(s!=null){total+=s;ws++}}}return ws?total/ws:0} function yearGrade(p,yr){return grade(yearScore(p,yr))}
function drawTrend(p){setTimeout(()=>{const c=document.getElementById('trend');if(!c)return;const ctx=c.getContext('2d'),ys=Object.keys(p.years).sort((a,b)=>+a-+b);ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#1d4ed8';ctx.lineWidth=3;ctx.beginPath();ys.forEach((yr,i)=>{const x=60+i*(880/Math.max(1,ys.length-1)),y=260-yearScore(p,yr)*2.2;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);ctx.fillStyle='#1d4ed8';ctx.fillRect(x-3,y-3,6,6);ctx.fillStyle='#172033';ctx.fillText(yr,x-18,285);ctx.fillText(yearScore(p,yr).toFixed(0),x-10,y-10)});ctx.stroke();ctx.strokeStyle='#94a3b8';ctx.beginPath();ctx.moveTo(50,40);ctx.lineTo(50,260);ctx.lineTo(960,260);ctx.stroke()},50)}
function compare(){const a=P.find(x=>x.id==document.getElementById('ca').value),b=P.find(x=>x.id==document.getElementById('cb').value);const e=document.getElementById('compareOut');if(!a||!b)return;if(a.pos!==b.pos){e.innerHTML='<div class="panel warn">同じ区分（野手同士・投手同士）で比較してください。</div>';return}const ms=metricList(a.pos);let html=`<div class="panel" id="comparePanel"><div class="two"><div class="card">${avatar(a)}<h2>${a.n}</h2><div class="badge grade-${overallGrade(a)}">${overallGrade(a)} ${overallScore(a).toFixed(1)}</div></div><div class="card">${avatar(b)}<h2>${b.n}</h2><div class="badge grade-${overallGrade(b)}">${overallGrade(b)} ${overallScore(b).toFixed(1)}</div></div></div><div class="scroll"><table class="table"><tr><th>項目</th><th>${a.n}</th><th>${b.n}</th><th>ランク</th></tr>`;for(const [m,l] of ms){const av=a.career[m],bv=b.career[m];const better=INV.has(m)?av<bv:av>bv;const ag=grade(percentile(P.filter(x=>x.pos===a.pos),a,m)),bg=grade(percentile(P.filter(x=>x.pos===b.pos),b,m));html+=`<tr><td>${l}</td><td class="${better?'winner':''}">${fmt(m,av)}</td><td class="${!better&&av!==bv?'winner':''}">${fmt(m,bv)}</td><td>${ag} / ${bg}</td></tr>`}html+=`</table></div><h3>年度別総合評価</h3><div class="two"><div>${yearBars(a)}</div><div>${yearBars(b)}</div></div></div>`;e.innerHTML=html}
function yearBars(p){return `<h4>${p.n}</h4>`+Object.keys(p.years).sort((a,b)=>+a-+b).map(y=>`<div class="statline"><span>${y}</span><b>${yearGrade(p,y)} ${yearScore(p,y).toFixed(1)}</b></div>`).join('')}
function ranking(){const pos=document.getElementById('rankType').value,m=document.getElementById('rankMetric').value,mode=document.getElementById('rankMode').value,list=P.filter(p=>p.pos===pos&&Number.isFinite(p.career[m])).map(p=>({p,s:percentile(P.filter(x=>x.pos===pos),p,m)})).sort((a,b)=>b.s-a.s);let html='';if(mode==='all'){html='<div class="panel"><h2>'+label(m)+' 全順位</h2><div class="scroll"><table class="table"><tr><th>順位</th><th>選手</th><th>球団</th><th>成績</th><th>ランク</th><th>点数</th></tr>'+list.map((z,i)=>`<tr><td>${i+1}</td><td>${z.p.n}</td><td>${z.p.teams.map(x=>TEAM[x]||x).join('・')}</td><td>${fmt(m,z.p.career[m])}</td><td><span class="badge grade-${grade(z.s)}">${grade(z.s)}</span></td><td>${z.s.toFixed(1)}</td></tr>`).join('')+'</table></div></div>'}else{html=GR.map(g=>{const a=list.filter(z=>grade(z.s)===g);return `<div class="panel rankGroup"><div class="rankTitle"><span class="badge grade-${g}">${g}</span> ${label(m)} ${a.length}人</div>${a.map(z=>`<span class="chip">${z.p.n}：${fmt(m,z.p.career[m])}</span>`).join('')||'<span class="small">該当なし</span>'}</div>`}).join('')}document.getElementById('rankingOut').innerHTML=html}
function label(m){return [...H,...R].find(x=>x[0]===m)?.[1]||m}
function similar(){const p=P.find(x=>x.id==document.getElementById('simPlayer').value),m=document.getElementById('simMetric').value,same=document.getElementById('simSame').value==='1',ord=document.getElementById('simOrder').value;if(!p)return;const pg=grade(percentile(P.filter(x=>x.pos===p.pos),p,m));let a=P.filter(x=>x.pos===p.pos&&x.id!==p.id&&Number.isFinite(x.career[m])).map(x=>({p:x,d:Math.abs(x.career[m]-p.career[m]),g:grade(percentile(P.filter(y=>y.pos===p.pos),x,m))}));if(same)a=a.filter(x=>x.g===pg);a.sort((x,y)=>ord==='near'?x.d-y.d:y.d-x.d);a=a.slice(0,20);document.getElementById('simOut').innerHTML=`<div class="panel"><h2>${p.n} / ${label(m)} / ${pg}ランク</h2><p>基準値：<b>${fmt(m,p.career[m])}</b></p><div class="scroll"><table class="table"><tr><th>選手</th><th>球団</th><th>成績</th><th>ランク</th><th>実数差</th></tr>${a.map(z=>`<tr><td>${z.p.n}</td><td>${z.p.teams.map(x=>TEAM[x]||x).join('・')}</td><td>${fmt(m,z.p.career[m])}</td><td>${z.g}</td><td>${fmt(m,z.d)}</td></tr>`).join('')||'<tr><td colspan="5">該当なし</td></tr>'}</table></div></div>`}
function battle(){const st=document.getElementById('battleStatus').value,type=document.getElementById('battleType').value,ta=document.getElementById('baTeam').value,tb=document.getElementById('bbTeam').value;let pool=P.filter(p=>(st==='all'||p.status===st)&&(type==='all'||p.pos===type)&&(ta==='all'||p.teams.includes(ta)));if(!pool.length)return alert('A側の条件に該当する選手がいません');const a=pool[Math.floor(Math.random()*pool.length)];let bpool=P.filter(p=>(st==='all'||p.status===st)&&p.pos===a.pos&&p.id!==a.id&&(tb==='all'||p.teams.includes(tb)));if(!bpool.length)bpool=P.filter(p=>p.pos===a.pos&&p.id!==a.id&&(tb==='all'||p.teams.includes(tb)));if(!bpool.length)return alert('B側の条件に該当する選手がいません');const b=bpool[Math.floor(Math.random()*bpool.length)];const ms=metricList(a.pos);let sa=0,sb=0,rows='';for(const [m,l] of ms){const av=a.career[m],bv=b.career[m];if(!Number.isFinite(av)||!Number.isFinite(bv))continue;const better=INV.has(m)?av<bv:av>bv;if(better)sa++;else if(av!==bv)sb++;rows+=`<tr><td>${l}</td><td class="${better?'winner':''}">${fmt(m,av)}</td><td class="${!better&&av!==bv?'winner':''}">${fmt(m,bv)}</td></tr>`}document.getElementById('battleOut').innerHTML=`<div class="panel"><div class="two"><div class="card"><h2>A：${a.n}</h2><p>${a.teams.map(x=>TEAM[x]||x).join('・')}</p><div class="rank">${sa}勝</div></div><div class="card"><h2>B：${b.n}</h2><p>${b.teams.map(x=>TEAM[x]||x).join('・')}</p><div class="rank">${sb}勝</div></div></div><div class="scroll"><table class="table"><tr><th>項目</th><th>A</th><th>B</th></tr>${rows}</table></div><h2>${sa>sb?'Aの勝ち':sb>sa?'Bの勝ち':'引き分け'}</h2><p class="small">A/Bの球団条件は独立しています。球団条件は「その球団に1年以上在籍した選手」を対象にしています。</p></div>`}
function renderFav(){const a=P.filter(p=>fav(p.id));document.getElementById('favOut').innerHTML=a.map(p=>`<div class="statline"><span>${p.n} / ${p.pos==='hitter'?'野手':'投手'}</span><button class="btn" onclick="detail(${p.id})">詳細</button></div>`).join('')||'お気に入りはありません。'}
function openSimilar(id){document.getElementById('simPlayer').value=id;switchTab('similar');similar()}
function showModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function exportPlayerCSV(id){const p=P.find(x=>x.id==id),rows=[['選手',p.n],['区分',p.status],['球団',p.teams.map(x=>TEAM[x]||x).join('/')],[],['年度','項目','値','ランク']];for(const [yr,y] of Object.entries(p.years)){for(const [m,l] of metricList(p.pos)){if(Number.isFinite(y[m]))rows.push([yr,l,y[m],grade(yearPct(yearPool(p.pos,yr),p,m,yr))])}}downloadCSV(rows,p.n+'年度別成績.csv')}
function downloadCSV(rows,name){const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportCompareCSV(){const a=P.find(x=>x.id==document.getElementById('ca').value),b=P.find(x=>x.id==document.getElementById('cb').value);if(!a||!b||a.pos!==b.pos)return;const rows=[['項目',a.n,b.n]];metricList(a.pos).forEach(([m,l])=>rows.push([l,a.career[m],b.career[m]]));downloadCSV(rows,'NPB選手比較.csv')}
function exportCompareImage(){const box=document.getElementById('comparePanel');if(!box)return;const w=1100,h=700,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#172033';ctx.font='bold 28px sans-serif';ctx.fillText('NPB Player DB 選手比較',30,45);ctx.font='bold 22px sans-serif';const a=P.find(x=>x.id==document.getElementById('ca').value),b=P.find(x=>x.id==document.getElementById('cb').value);ctx.fillText(a.n,40,90);ctx.fillText(b.n,560,90);let y=135;for(const [m,l] of metricList(a.pos)){ctx.font='16px sans-serif';ctx.fillText(l,40,y);ctx.fillText(fmt(m,a.career[m]),250,y);ctx.fillText(fmt(m,b.career[m]),770,y);y+=35;if(y>660)break}const link=document.createElement('a');link.download='NPB選手比較.png';link.href=c.toDataURL('image/png');link.click()}
function setMetrics(type,rankId,simId){const e=document.getElementById(rankId);e.innerHTML='';metricList(type).forEach(x=>e.insertAdjacentHTML('beforeend',`<option value="${x[0]}">${x[1]}</option>`));if(simId){const s=document.getElementById(simId);s.innerHTML='';metricList(type).forEach(x=>s.insertAdjacentHTML('beforeend',`<option value="${x[0]}">${x[1]}</option>`))}}
function switchTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));if(id==='favorites')renderFav()}
function init(){teamOptions('team');teamOptions('baTeam');teamOptions('bbTeam');playerOptions('ca');playerOptions('cb');playerOptions('simPlayer');setMetrics('hitter','rankMetric','simMetric');renderSearch();renderFav();compare();ranking();similar();
for(const id of ['q','status','team','type','favOnly'])document.getElementById(id).addEventListener('input',renderSearch);for(const id of ['ca','cb'])document.getElementById(id).addEventListener('change',compare);document.getElementById('rankType').onchange=()=>{setMetrics(document.getElementById('rankType').value,'rankMetric');ranking()};for(const id of ['rankMetric','rankMode'])document.getElementById(id).onchange=ranking;for(const id of ['simPlayer','simMetric','simSame','simOrder'])document.getElementById(id).onchange=similar;document.getElementById('battleBtn').onclick=battle;document.getElementById('battleAgain').onclick=battle;document.getElementById('csvCompare').onclick=exportCompareCSV;document.getElementById('exportCompare').onclick=exportCompareImage;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));}
init();
document.getElementById('dbFile')?.addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importDatabaseFile(f).catch(err=>alert('読み込み失敗: '+err.message))});

async function updateFromServer(){
 const btn=document.getElementById('updateBtn'), st=document.getElementById('updateProgress');
 btn.disabled=true; st.textContent='最新のクラウドデータを確認しています…';
 try{await tryAutoLoadDatabase(true);st.textContent='最新データを読み込みました。';}
 catch(e){st.textContent='データの読み込みに失敗しました。';}
 finally{btn.disabled=false;}
}
async function tryAutoLoadDatabase(force=false){try{const r=await fetch('data/database.json',{cache:'no-store'});if(!r.ok)return;const db=await r.json();if(Array.isArray(db.players)){const imported=db.players.map(normalizeExternalPlayer);P.length=0;imported.forEach(x=>P.push(x));refreshAll();document.getElementById('dbStatus').textContent=` ${P.length.toLocaleString()}選手（data/database.jsonを自動読込）`;localStorage.setItem('npbExternalDb',JSON.stringify(db));}}catch(e){}}
setTimeout(tryAutoLoadDatabase,150);
try{const saved=localStorage.getItem('npbExternalDb');if(saved){const db=JSON.parse(saved);if(Array.isArray(db.players)){const imported=db.players.map(normalizeExternalPlayer);P.length=0;imported.forEach(x=>P.push(x));setTimeout(()=>{refreshAll();document.getElementById('dbStatus').textContent=` ${P.length.toLocaleString()}選手（保存済みデータ）`;},0)}}}catch(e){}
</script>
